; ==============================================================================
; КОНФИГУРАЦИЯ LLAMA.CPP ДЛЯ WINDOWS
; ==============================================================================
; Читается скриптами llama-windows-install.ps1 и llama-windows-uninstall.ps1.
; Все параметры опциональны — при отсутствии используются значения по умолчанию.

[paths]
; Каталог для установки бинарников llama.cpp. Рекомендуется хранить скрипты в
; подпапке install внутри LlamaCppDir (например, D:\AI\Llama.cpp\install).
LlamaCppDir=D:\AI\Llama.cpp

; Каталог для моделей (.gguf). Должен быть внутри LlamaCppDir,
; чтобы не терялся при обновлении. Сохраняется в любом случае.
ModelsDir=D:\AI\Llama.cpp\Models

; Каталог для распаковки утилиты NSSM.
NssmDir=C:\Program Files\NSSM

; Каталог для логов службы (stdout и stderr). Пусто = <LlamaCppDir>\logs.
LogsDir=

; Каталог для скачанных дистрибутивов (архивов llama.cpp и NSSM).
; Рекомендуется оставлять внутри LlamaCppDir — тогда NSSM-архив сохраняется
; при обновлении. Пусто = <LlamaCppDir>\Downloads.
DownloadsDir=D:\AI\Llama.cpp\Downloads

; Каталог для резервных копий при обновлении.
; Пусто = <LlamaCppDir>\Backup.
BackupDir=D:\AI\Llama.cpp\Backup

[service]
; Имя службы Windows.
ServiceName=LlamaCpp

; Тип запуска: SERVICE_DELAYED_AUTO_START (рекомендуется), SERVICE_AUTO_START, SERVICE_DEMAND_START.
StartType=SERVICE_DELAYED_AUTO_START

; Максимальное время ожидания запуска службы (в секундах).
StartTimeoutSeconds=120

; Задержка перед перезапуском после падения (мс).
AppRestartDelay=10000

; Добавить каталог LlamaCppDir в PATH.
AddToPath=true

; Добавить папки NSSM (win32 и win64) в Machine PATH, чтобы nssm.exe был
; доступен из любой консоли без полного пути.
AddNssmToPath=true

; Ротация логов: файлы в LogsDir старше указанного количества дней удаляются.
; 0 = отключить очистку логов.
LogRetentionDays=7

[network]
; Адрес API: 0.0.0.0 (сеть) или 127.0.0.1 (локально).
Host=0.0.0.0

; TCP-порт.
Port=8080

; Создавать правило брандмауэра.
FirewallEnabled=true

; Подсеть для правила (CIDR). Пусто = правило не создается.
FirewallSubnet=192.168.117.0/24

[downloads]
; Версия llama.cpp: ask (меню), latest (последняя), или конкретная (например, b12184).
; При использовании параметра -Upgrade это значение игнорируется (берется latest).
LlamaCppVersion=ask

; Резервный URL для скачивания бинарников, если GitHub API недоступен.
LlamaCppUrl=https://github.com/ggml-org/llama.cpp/releases/download/b12184/llama-b12184-bin-win-cuda-13.5-x64.zip

; Резервный URL для CUDA runtime (cudart).
CudartUrl=https://github.com/ggml-org/llama.cpp/releases/download/b12184/cudart-llama-bin-win-cuda-13.5-x64.zip

; URL для NSSM.
NssmUrl=https://github.com/dkxce/NSSM/releases/download/v2.25/NSSM_v2.25.zip

; Удалять ли архивы после распаковки:
;   true  — оставлять в папке Downloads (архивы NSSM сохраняются),
;   false — удалять после распаковки (экономит место).
KeepDownloads=true

[server]
; Путь к файлу модели (.gguf). Обязательный параметр.
Model=D:\AI\Llama.cpp\Models\model.gguf

; Размер контекста (ctx-size).
CtxSize=4096

; Количество слоёв, выгружаемых на GPU (-ngl). 0 = только CPU, 999 = все слои.
NGpuLayers=999

; Включить Flash Attention (-fa).
FlashAttention=true

; Количество параллельных слотов (--parallel).
Parallel=1

; Дополнительные аргументы для llama-server (будут добавлены в командную строку как есть).
; Пример: --threads 8 --batch-size 512
ExtraArgs=
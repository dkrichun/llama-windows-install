[paths]
LlamaCppDir=D:\AI\Llama.cpp
ModelsDir=D:\AI\Llama.cpp\Models
; ... остальные пути без изменений

[service]
ServiceName=LlamaCpp
; ... остальные параметры службы без изменений

[network]
Host=0.0.0.0
Port=8080
; ... остальные параметры сети без изменений

[downloads]
LlamaCppVersion=ask
; ... остальные параметры загрузки без изменений

[server]
; Параметры, общие для всех моделей в Router-режиме
CtxSize=4096
NGpuLayers=999
FlashAttention=true
Parallel=1
ExtraArgs=
ForceCPU=false

[models]
; Показывать интерактивное меню выбора моделей при установке
Interactive=true

; Модели для неинтерактивного режима (через запятую).
; Формат: <hf-repo>:<quant>|<short-name>
; Пример: bartowski/Qwen2.5-7B-Instruct-GGUF:Q4_K_M|qwen7b
Models=
